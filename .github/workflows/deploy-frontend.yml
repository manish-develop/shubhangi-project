name: Deploy frontend to Hostinger

# Replaces Hostinger's own "hbuilds" auto-deploy, which stopped triggering
# on new commits (confirmed via its deploy logs on the server — no run
# since Sep 14, despite many commits since). This workflow does the same
# job ourselves: build, then upload dist/ over SFTP.
#
# Also serves as the rebuild trigger for static-generation: repository_dispatch
# lets an external system (a WordPress publish webhook, or our own admin
# panel after a Supabase content change) kick off a fresh build+deploy
# on demand, not just on a code push.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-frontend.yml'
  repository_dispatch:
    types: [rebuild-frontend]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # build:ssg = vite build, then a headless-browser pass over every
      # route (static pages + every disease/blog/service, fetched live
      # from WordPress/Supabase) that bakes real rendered content into a
      # static HTML file per route. Fixes both the "meta/schema only after
      # JS runs" gap and, more importantly, mobile PageSpeed — a cold
      # visit no longer has to download+run the JS bundle and then fetch
      # data before anything paints.
      - name: Build (with static prerendering)
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build:ssg

      - name: Deploy to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: 'apps/web/dist/*,apps/web/dist/.htaccess'
          target: ${{ secrets.HOSTINGER_WEB_ROOT }}
          strip_components: 3
